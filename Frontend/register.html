<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>

    <main>
        <div class="form-container">
            <h2>Register</h2>
            <form>
                <input type="text" placeholder="Enter Full Name" id="register_name">
                <input type="email" placeholder="Enter Email Address" id="register_email">
                <input type="password" placeholder="Enter Password" id="register_password">
                <input type="password" placeholder="Confirm Password" id="register_confirm_password">
                <button class="register-btn">Register</button>
            </form>
        </div>
    </main>
    
</body>
</html>
