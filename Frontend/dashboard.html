<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="global.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <ul>
        <li class="register-list">Register</li>
        <li class="login-list">Login</li>
        <li class="logout-list">Logout</li>
      </ul>
    </nav>

    <main>
      <div class="dashboard-container">
        <div class="dashboard-header">
          <h2>Contacts</h2>
          <button class="add-contact-btn">Add New Contact</button>
        </div>
        <div class="contact-table-box">
          <table>
            <thead>
              <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Kailash</td>
                <td>Kumar</td>
                <td>Kailash@gmail.com</td>
                <td>9049348633</td>
                <td class="action-box">
                  <button class="edit-placeholder">Edit</button>
                  <button class="delete-placeholder">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
